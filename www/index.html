<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>musab sw</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: #090d16;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      color: #f8fafc;
      touch-action: none;
    }
    #gameContainer {
      position: relative;
      width: 100%;
      max-width: 400px;
      height: 100vh;
      max-height: 700px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      touch-action: none;
      display: block;
      background: #0f172a;
      width: 100%;
      height: 100%;
      max-width: 400px;
      max-height: 700px;
    }
    .modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      padding: 24px;
      text-align: center;
      background: rgba(15, 23, 42, 0.94);
    }
    .btn {
      background: #3b82f6;
      border: none;
      color: white;
      padding: 14px 20px;
      font-size: 1.05rem;
      border-radius: 16px;
      cursor: pointer;
      font-weight: 700;
      margin: 6px 0;
      width: 100%;
      max-width: 280px;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.3);
      transition: transform 0.1s;
    }
    .btn:active {
      transform: scale(0.96);
    }
    .btn-gold {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.3);
    }
    .btn-green {
      background: #10b981;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
    }
    .btn-secondary {
      background: #1e293b;
      color: #cbd5e1;
      box-shadow: none;
      border: 1px solid #334155;
    }

    #mapModal {
      display: none;
      background: rgba(15, 23, 42, 0.98);
      justify-content: flex-start;
      padding-top: 20px;
    }
    .map-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 0 8px 12px;
      border-bottom: 2px solid #1e293b;
    }
    .levels-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      width: 100%;
      max-height: 490px;
      overflow-y: auto;
      padding: 12px 4px;
    }
    .level-node {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 16px;
      padding: 10px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .level-node.unlocked {
      border-color: #38bdf8;
      background: #0f2744;
    }
    .level-node.completed {
      border-color: #10b981;
      background: #064e3b;
    }
    .level-node.boss-level {
      border-color: #ef4444;
      background: #450a0a;
    }
    .level-node.locked {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .level-num {
      font-size: 1.1rem;
      font-weight: 800;
      color: #f8fafc;
    }
    .level-badge {
      font-size: 0.65rem;
      font-weight: 700;
      color: #94a3b8;
    }

    #lossControlBar {
      position: absolute;
      bottom: 20px;
      left: 0;
      width: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 8;
      padding: 0 20px;
    }

    #winModal, #guideModal {
      display: none;
    }
    .guide-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 24px;
      padding: 24px 20px;
      width: 92%;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>

  <div id="gameContainer">
    <canvas id="gameCanvas" width="400" height="700"></canvas>

    <!-- القائمة الرئيسية -->
    <div id="startModal" class="modal">
      <div style="font-size: 2.8rem; margin-bottom: 4px;">🧩</div>
      <h1 style="font-size: 2.3rem; font-weight: 900; margin-bottom: 6px; color: #38bdf8; letter-spacing: -0.5px;">musab sw</h1>
      <p style="font-size: 0.95rem; color: #94a3b8; margin-bottom: 24px; font-weight: 500;">تحدي الذكاء الاستراتيجي • 100 مرحلة</p>
      
      <button class="btn btn-gold" onclick="openLevelMap()">🗺️ خريطة الـ 100 مرحلة</button>
      <button class="btn" onclick="initAndCheckGuide('daily')">⭐ التحدي اليومي الخاص</button>
      <button class="btn btn-secondary" onclick="initAndCheckGuide('classic')">♾️ اللعب اللانهائي التكتيكي</button>
    </div>

    <!-- نافذة الإرشادات -->
    <div id="guideModal" class="modal">
      <div class="guide-card">
        <div id="guideIcon" style="font-size: 2.8rem; margin-bottom: 10px;">⭐</div>
        <div id="guideTitle" style="font-size: 1.3rem; font-weight: 800; color: #f8fafc; margin-bottom: 8px;">تعليمات النمط</div>
        <div id="guideDesc" style="font-size: 0.92rem; color: #cbd5e1; line-height: 1.55; margin-bottom: 20px;">الشرح هنا...</div>
        <button class="btn btn-green" onclick="startAfterGuide()">فهمت، ابدأ الآن 🚀</button>
      </div>
    </div>

    <!-- خريطة الـ 100 مرحلة -->
    <div id="mapModal" class="modal">
      <div class="map-header">
        <div>
          <h2 style="font-size: 1.3rem; font-weight: 800; color: #f8fafc;">خريطة المراحل</h2>
          <span id="biomeName" style="font-size: 0.78rem; font-weight: 600; color: #38bdf8;">العالم 1</span>
        </div>
        <span id="totalStarsCount" style="color: #fbbf24; font-weight: 800; font-size: 1.05rem;">🏆 0</span>
      </div>
      <div class="levels-grid" id="levelsGridContainer"></div>
      <button class="btn btn-secondary" style="margin-top: 10px;" onclick="closeLevelMap()">العودة للقائمة</button>
    </div>

    <!-- نافذة الفوز -->
    <div id="winModal" class="modal">
      <div style="font-size: 2.8rem; margin-bottom: 6px;">🎉</div>
      <h2 style="font-size: 2rem; font-weight: 900; color: #10b981; margin-bottom: 8px;">اكتملت المرحلة!</h2>
      <p id="winSubtext" style="font-size: 0.95rem; margin-bottom: 22px; color: #cbd5e1; line-height: 1.5; font-weight: 500;"></p>
      <button id="nextLevelBtn" class="btn btn-green" onclick="goToNextLevel()">المرحلة التالية ⏭️</button>
      <button class="btn btn-secondary" onclick="openLevelMapFromGame()">خريطة المراحل 🗺️</button>
    </div>

    <!-- شريط الخسارة الهادئ -->
    <div id="lossControlBar">
      <button id="reviveBtn" class="btn btn-green" onclick="useRevive()">🛡️ فرصة أخيرة (تفريغ الوسط)</button>
      <button class="btn" onclick="restartCurrentMode()">إعادة المحاولة</button>
      <button class="btn btn-secondary" onclick="openLevelMapFromGame()">خريطة المراحل 🗺️</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const startModal = document.getElementById("startModal");
    const guideModal = document.getElementById("guideModal");
    const guideIcon = document.getElementById("guideIcon");
    const guideTitle = document.getElementById("guideTitle");
    const guideDesc = document.getElementById("guideDesc");
    const mapModal = document.getElementById("mapModal");
    const levelsGridContainer = document.getElementById("levelsGridContainer");
    const biomeName = document.getElementById("biomeName");
    const totalStarsCount = document.getElementById("totalStarsCount");
    const winModal = document.getElementById("winModal");
    const winSubtext = document.getElementById("winSubtext");
    const nextLevelBtn = document.getElementById("nextLevelBtn");
    const lossControlBar = document.getElementById("lossControlBar");
    const reviveBtn = document.getElementById("reviveBtn");

    // ==========================================
    // 1. ضبط دقة الشاشة الفائقة (Retina HD Fix)
    // ==========================================
    function setupHighDPI() {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = (rect.width || 400) * dpr;
      canvas.height = (rect.height || 700) * dpr;
      ctx.scale(dpr, dpr);
    }
    setupHighDPI();
    window.addEventListener("resize", setupHighDPI);

    // ==========================================
    // 2. الصوت والاهتزاز
    // ==========================================
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playSoftTone(freq, duration = 0.14, maxGain = 0.15) {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(maxGain, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + duration);
      } catch (e) {}
    }

    function triggerHaptic(ms = 25) {
      if (navigator.vibrate) {
        try { navigator.vibrate(ms); } catch (e) {}
      }
    }

    // ==========================================
    // 3. التمرير للرجوع (Edge Swipe)
    // ==========================================
    let touchStartX = 0;
    let touchStartY = 0;

    window.addEventListener("touchstart", (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    window.addEventListener("touchend", (e) => {
      const touchEndX = e.changedTouches[0].clientX;
      const touchEndY = e.changedTouches[0].clientY;
      const diffX = touchEndX - touchStartX;
      const diffY = Math.abs(touchEndY - touchStartY);

      if (touchStartX > window.innerWidth - 60 && diffX < -80 && diffY < 60) {
        if (mapModal.style.display === "flex") closeLevelMap();
        else if (gameLoopActive) {
          autoSaveCurrentMode();
          gameLoopActive = false;
          startModal.style.display = "flex";
        }
      }
    }, { passive: true });

    // ==========================================
    // 4. خريطة الـ 100 مرحلة
    // ==========================================
    const TOTAL_LEVELS = 100;
    const BIOMES = [
      { name: "العالم 1: السديم الأزرق", bg: "#090d16", canvasBg: "#0f172a", emptyCell: "#1e293b", blockedCell: "#3b1717", text: "#38bdf8" },
      { name: "العالم 2: الغابة الليلية", bg: "#06130d", canvasBg: "#092015", emptyCell: "#113824", blockedCell: "#3b1717", text: "#34d399" },
      { name: "العالم 3: الكثبان الذهبية", bg: "#130e06", canvasBg: "#221708", emptyCell: "#3d2b0e", blockedCell: "#3b1717", text: "#fbbf24" },
      { name: "العالم 4: الشفق الوردي", bg: "#140810", canvasBg: "#240e1c", emptyCell: "#411832", blockedCell: "#3b1717", text: "#f472b6" },
      { name: "العالم 5: الهضاب البنفسجية", bg: "#0e0818", canvasBg: "#170c28", emptyCell: "#2c174d", blockedCell: "#3b1717", text: "#c084fc" }
    ];

    function getCurrentBiome(lvl) {
      const idx = Math.floor((lvl - 1) / 20) % BIOMES.length;
      return BIOMES[idx];
    }

    function getLevelConfiguration(lvl) {
      const isBoss = (lvl % 7 === 0);
      let goalType = "score", reqScore = 0, reqStars = 0, rockObstacles = 0;

      if (lvl > 20) rockObstacles = 1;
      if (lvl > 50) rockObstacles = 2;
      if (lvl > 80) rockObstacles = 3;

      if (isBoss) {
        goalType = "boss_timer";
        reqScore = 1400 + (lvl * 120);
        reqStars = 4 + Math.floor(lvl * 0.15);
      } else if (lvl % 3 === 1) {
        goalType = "score";
        reqScore = 500 + (lvl * 110);
      } else if (lvl % 3 === 2) {
        goalType = "stars";
        reqStars = 4 + Math.floor(lvl * 0.25);
      } else {
        goalType = "hybrid";
        reqScore = 400 + (lvl * 80);
        reqStars = 3 + Math.floor(lvl * 0.18);
      }

      return { level: lvl, isBoss, goalType, targetScore: reqScore, targetStars: reqStars, hasTimer: isBoss, rockObstacles };
    }

    let levelProgress = JSON.parse(localStorage.getItem("bb_100_levels")) || { 1: true };

    function saveLevelCompleted(lvl) {
      levelProgress[lvl] = true;
      if (lvl < TOTAL_LEVELS) levelProgress[lvl + 1] = true;
      localStorage.setItem("bb_100_levels", JSON.stringify(levelProgress));
    }

    function renderMapGrid() {
      levelsGridContainer.innerHTML = "";
      let completedCount = 0;

      for (let i = 1; i <= TOTAL_LEVELS; i++) {
        const isUnlocked = levelProgress[i] !== undefined;
        const isCompleted = levelProgress[i] === true && (i < Object.keys(levelProgress).length || i === TOTAL_LEVELS);
        if (isCompleted) completedCount++;

        const cfg = getLevelConfiguration(i);
        const node = document.createElement("div");
        node.className = `level-node ${isUnlocked ? "unlocked" : "locked"} ${isCompleted ? "completed" : ""} ${cfg.isBoss ? "boss-level" : ""}`;

        let badge = cfg.isBoss ? "⚡ تحدي" : cfg.goalType === "score" ? `🎯 ${cfg.targetScore}` : cfg.goalType === "stars" ? `⭐ ${cfg.targetStars}` : `🎯+⭐`;
        node.innerHTML = `
          <div class="level-num">${isUnlocked ? (cfg.isBoss ? "🔥" + i : i) : "🔒"}</div>
          <div class="level-badge">${isUnlocked ? badge : ""}</div>
        `;

        if (isUnlocked) node.onclick = () => initAndCheckGuide("levels", i);
        levelsGridContainer.appendChild(node);
      }

      const activeBiome = getCurrentBiome(activeLevel);
      biomeName.textContent = activeBiome.name;
      totalStarsCount.textContent = `🏆 ${completedCount}/${TOTAL_LEVELS}`;
    }

    function openLevelMap() {
      initAudio();
      renderMapGrid();
      startModal.style.display = "none";
      mapModal.style.display = "flex";
    }

    function closeLevelMap() {
      mapModal.style.display = "none";
      startModal.style.display = "flex";
    }

    function openLevelMapFromGame() {
      winModal.style.display = "none";
      lossControlBar.style.display = "none";
      openLevelMap();
    }

    // ==========================================
    // 5. نظام التوجيه الذكي
    // ==========================================
    let seenGuides = JSON.parse(localStorage.getItem("bb_seen_guides_v2")) || {};
    let pendingStartMode = "classic";
    let pendingStartLevel = 1;

    function initAndCheckGuide(mode, lvl = 1) {
      initAudio();
      pendingStartMode = mode;
      pendingStartLevel = lvl;
      startModal.style.display = "none";
      mapModal.style.display = "none";

      let guideKey = mode === "levels" ? `level_${getLevelConfiguration(lvl).goalType}` : mode;
      if (seenGuides[guideKey]) {
        executeGameStart();
        return;
      }

      if (mode === "levels") {
        const cfg = getLevelConfiguration(lvl);
        guideIcon.textContent = cfg.isBoss ? "⏱️🔥" : cfg.goalType === "score" ? "🎯" : cfg.goalType === "stars" ? "⭐" : "💎⭐";
        guideTitle.textContent = cfg.isBoss ? "تحدي النبضات والوقت" : cfg.goalType === "score" ? "نمط جمع النقاط" : cfg.goalType === "stars" ? "نمط جمع النجوم" : "النمط المزدوج";
        guideDesc.textContent = "فكّر بذكاء، خطط لكل حركة مسبقاً، واصنع الكومبو لتحقيق الهدف!";
      } else if (mode === "daily") {
        guideIcon.textContent = "📅⭐";
        guideTitle.textContent = "التحدي اليومي الخاص";
        guideDesc.textContent = "اجمع 1200 نقطة و 5 نجوم وقنابل متفجرة 💣 لإحراز الشارة اليومية!";
      } else {
        guideIcon.textContent = "♾️";
        guideTitle.textContent = "النمط اللانهائي التكتيكي";
        guideDesc.textContent = "صعوبة تصاعدية، واختبار حاسم لدقيقتين عند بلوغ الأرقام القياسية!";
      }

      guideModal.style.display = "flex";
    }

    function startAfterGuide() {
      let guideKey = pendingStartMode === "levels" ? `level_${getLevelConfiguration(pendingStartLevel).goalType}` : pendingStartMode;
      seenGuides[guideKey] = true;
      localStorage.setItem("bb_seen_guides_v2", JSON.stringify(seenGuides));
      guideModal.style.display = "none";
      executeGameStart();
    }

    function executeGameStart() {
      if (pendingStartMode === "levels") startSpecificLevel(pendingStartLevel);
      else startGame(pendingStartMode);
    }

    // ==========================================
    // 6. إعدادات الشبكة المكبرة ومكتبة الأشكال
    // ==========================================
    const GRID_SIZE = 8;
    const CELL_SIZE = 43; // تكبير المربعات من 38 إلى 43
    const GRID_OFFSET_X = (400 - GRID_SIZE * CELL_SIZE) / 2; // توسيط في الـ 400px
    const GRID_OFFSET_Y = 100;

    let gameMode = "classic", activeLevel = 1, score = 0, starsCollected = 0;
    let currentConfig = null;
    let highScore = parseInt(localStorage.getItem("bb_final_high")) || 0;
    let grid = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(0));

    let bossSecondsElapsed = 0, bossTimerInterval = null, hasUsedRevive = false;
    let comboStreak = 0, gameLoopActive = false, isGameOverState = false;
    let movesCounter = 0, inEliteTest = false, eliteTimer = 120;

    const SHAPES_CATALOG = [
      { id: "line_2_h", color: "#0ea5e9", blocks: [[0, 0], [0, 1]] },
      { id: "line_2_v", color: "#0ea5e9", blocks: [[0, 0], [1, 0]] },
      { id: "line_3_h", color: "#10b981", blocks: [[0, 0], [0, 1], [0, 2]] },
      { id: "line_3_v", color: "#10b981", blocks: [[0, 0], [1, 0], [2, 0]] },
      { id: "square_2x2", color: "#f59e0b", blocks: [[0, 0], [0, 1], [1, 0], [1, 1]] },
      { id: "corner", color: "#8b5cf6", blocks: [[0, 0], [1, 0], [1, 1]] },
      { id: "corner_rev", color: "#8b5cf6", blocks: [[0, 1], [1, 1], [1, 0]] },
      { id: "l_shape", color: "#f97316", blocks: [[0, 0], [1, 0], [2, 0], [2, 1]] },
      { id: "j_shape", color: "#f97316", blocks: [[0, 1], [1, 1], [2, 1], [2, 0]] },
      { id: "line_4_h", color: "#3b82f6", blocks: [[0, 0], [0, 1], [0, 2], [0, 3]] },
      { id: "line_4_v", color: "#3b82f6", blocks: [[0, 0], [1, 0], [2, 0], [3, 0]] },
      { id: "square_3x3", color: "#ec4899", blocks: [[0, 0], [0, 1], [0, 2], [1, 0], [1, 1], [1, 2], [2, 0], [2, 1], [2, 2]] }
    ];

    let hand = [];
    let draggedPiece = null;
    let dragOffsetX = 0, dragOffsetY = 0;
    let previewTarget = null;
    const floatingTexts = [];

    // ==========================================
    // 7. الحفظ التلقائي لكل نمط
    // ==========================================
    function autoSaveCurrentMode() {
      if (!gameLoopActive) return;
      const data = { score, starsCollected, bossSecondsElapsed, hasUsedRevive, grid, hand, activeLevel, movesCounter, inEliteTest, eliteTimer };
      localStorage.setItem(`bb_autosave_${gameMode}`, JSON.stringify(data));
    }

    function loadModeSave(mode) {
      const saved = localStorage.getItem(`bb_autosave_${mode}`);
      return saved ? JSON.parse(saved) : null;
    }

    // ==========================================
    // 8. منطق التوليد (قاعدة المخرج الواحد)
    // ==========================================
    function canPlace(shape, r0, c0) {
      for (const [dr, dc] of shape.blocks) {
        const r = r0 + dr, c = c0 + dc;
        if (r < 0 || r >= GRID_SIZE || c < 0 || c >= GRID_SIZE || grid[r][c] !== 0) return false;
      }
      return true;
    }

    function countValidPositions(shape) {
      let count = 0;
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          if (canPlace(shape, r, c)) count++;
        }
      }
      return count;
    }

    function generateSmartHand() {
      let validShapes = SHAPES_CATALOG.filter(s => countValidPositions(s) > 0);
      if (validShapes.length === 0) {
        triggerGameOver();
        return;
      }

      const selected = [JSON.parse(JSON.stringify(validShapes[Math.floor(Math.random() * validShapes.length)]))];
      for (let i = 1; i < 3; i++) {
        selected.push(JSON.parse(JSON.stringify(SHAPES_CATALOG[Math.floor(Math.random() * SHAPES_CATALOG.length)])));
      }

      // خلط القطع
      for (let i = selected.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [selected[i], selected[j]] = [selected[j], selected[i]];
      }

      const needsStars = currentConfig && (currentConfig.goalType === "stars" || currentConfig.goalType === "hybrid" || currentConfig.isBoss);
      const starPieceIdx = needsStars ? (Math.random() < 0.75 ? Math.floor(Math.random() * 3) : -1) : -1;

      const slotWidth = 400 / 3;
      hand = selected.map((p, idx) => {
        const shapeW = (Math.max(...p.blocks.map(b => b[1])) + 1) * 19;
        const shapeH = (Math.max(...p.blocks.map(b => b[0])) + 1) * 19;
        const cx = slotWidth * idx + slotWidth / 2 - shapeW / 2;
        const cy = 560 - shapeH / 2;
        const starIdx = (idx === starPieceIdx) ? Math.floor(Math.random() * p.blocks.length) : -1;

        return { ...p, x: cx, y: cy, origX: cx, origY: cy, size: 19, starBlockIndex: starIdx };
      });

      autoSaveCurrentMode();
      checkGameState();
    }

    function spawnInitialElements(gemCount, rockCount) {
      grid = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(0));
      let rocksPlaced = 0;
      while (rocksPlaced < rockCount) {
        const r = Math.floor(Math.random() * 6) + 1, c = Math.floor(Math.random() * 6) + 1;
        if (grid[r][c] === 0) {
          grid[r][c] = { color: "#475569", isRock: true };
          rocksPlaced++;
        }
      }

      let placed = 0;
      while (placed < gemCount) {
        const r = Math.floor(Math.random() * GRID_SIZE), c = Math.floor(Math.random() * GRID_SIZE);
        if (grid[r][c] === 0) {
          const isBomb = Math.random() < 0.28;
          grid[r][c] = { color: isBomb ? "#ef4444" : "#3b82f6", hasGem: true, isBomb };
          placed++;
        }
      }
    }

    // ==========================================
    // 9. تشغيل الأنماط والحسابات
    // ==========================================
    function startSpecificLevel(lvl) {
      gameMode = "levels";
      activeLevel = lvl;
      currentConfig = getLevelConfiguration(lvl);
      isGameOverState = false;
      lossControlBar.style.display = "none";

      const saved = loadModeSave("levels");
      if (saved && saved.activeLevel === lvl && saved.grid) {
        score = saved.score; starsCollected = saved.starsCollected;
        bossSecondsElapsed = saved.bossSecondsElapsed; hasUsedRevive = saved.hasUsedRevive;
        grid = saved.grid; hand = saved.hand;
      } else {
        score = 0; starsCollected = 0; bossSecondsElapsed = 0; hasUsedRevive = false;
        const gemTarget = (currentConfig.goalType === "stars" || currentConfig.goalType === "hybrid" || currentConfig.isBoss)
          ? Math.max(2, Math.floor(currentConfig.targetStars * 0.4)) : 0;
        spawnInitialElements(gemTarget, currentConfig.rockObstacles);
      }

      if (currentConfig.hasTimer) startTimer();
      gameLoopActive = true;
      if (!hand || hand.length === 0) generateSmartHand();
      else checkGameState();
    }

    function startGame(mode) {
      gameMode = mode;
      hasUsedRevive = false; isGameOverState = false;
      lossControlBar.style.display = "none";
      const saved = loadModeSave(mode);

      if (saved && saved.grid) {
        score = saved.score; starsCollected = saved.starsCollected; bossSecondsElapsed = saved.bossSecondsElapsed;
        grid = saved.grid; hand = saved.hand; movesCounter = saved.movesCounter || 0;
        inEliteTest = saved.inEliteTest || false; eliteTimer = saved.eliteTimer || 120;
      } else {
        score = 0; starsCollected = 0; bossSecondsElapsed = 0; movesCounter = 0; inEliteTest = false; eliteTimer = 120;
        if (mode === "daily") {
          currentConfig = { isBoss: false, goalType: "hybrid", targetScore: 1200, targetStars: 5, hasTimer: false };
          spawnInitialElements(3, 1);
        } else {
          currentConfig = { isBoss: false, goalType: "classic", targetScore: 0, targetStars: 0, hasTimer: false };
          grid = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(0));
        }
      }

      gameLoopActive = true;
      if (!hand || hand.length === 0) generateSmartHand();
      else checkGameState();
    }

    function startTimer() {
      if (bossTimerInterval) clearInterval(bossTimerInterval);
      bossTimerInterval = setInterval(() => {
        if (!gameLoopActive) return;
        bossSecondsElapsed++;
        if (inEliteTest) {
          eliteTimer--;
          if (eliteTimer <= 0) triggerGameOver();
        }
      }, 1000);
    }

    const PENTATONIC = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];

    function placeAndProcess(piece, tr, tc) {
      movesCounter++;
      piece.blocks.forEach(([dr, dc], idx) => {
        grid[tr + dr][tc + dc] = (piece.starBlockIndex === idx)
          ? { color: piece.color, hasGem: true, isBomb: false }
          : piece.color;
      });

      score += piece.blocks.length * 5;

      let rowsToClear = [], colsToClear = [];
      for (let r = 0; r < GRID_SIZE; r++) { if (grid[r].every(c => c !== 0)) rowsToClear.push(r); }
      for (let c = 0; c < GRID_SIZE; c++) { if (grid.every(row => row[c] !== 0)) colsToClear.push(c); }

      const totalLines = rowsToClear.length + colsToClear.length;
      if (totalLines > 0) {
        comboStreak++;
        triggerHaptic(40);
        playSoftTone(PENTATONIC[Math.min(comboStreak - 1, PENTATONIC.length - 1)], 0.22, 0.25);

        const checkAndClear = (r, c) => {
          const cell = grid[r][c];
          if (cell && cell.hasGem && !cell.isBomb) starsCollected++;
          grid[r][c] = 0;
        };

        rowsToClear.forEach(r => { for (let c = 0; c < GRID_SIZE; c++) checkAndClear(r, c); });
        colsToClear.forEach(c => { for (let r = 0; r < GRID_SIZE; r++) checkAndClear(r, c); });

        score += totalLines * 120 * comboStreak;
      } else {
        comboStreak = 0;
        playSoftTone(220, 0.08, 0.1);
      }

      if (score > highScore) {
        highScore = score;
        localStorage.setItem("bb_final_high", highScore);
      }

      hand = hand.filter(p => p !== piece);

      if (checkWinConditions()) {
        triggerWin();
        return;
      }

      if (hand.length === 0) generateSmartHand();
      else {
        autoSaveCurrentMode();
        checkGameState();
      }
    }

    function checkWinConditions() {
      if (gameMode !== "levels" && gameMode !== "daily") return false;
      if (!currentConfig) return false;
      if (currentConfig.goalType === "score") return score >= currentConfig.targetScore;
      if (currentConfig.goalType === "stars") return starsCollected >= currentConfig.targetStars;
      if (currentConfig.goalType === "hybrid" || currentConfig.goalType === "boss_timer") {
        return score >= currentConfig.targetScore && starsCollected >= currentConfig.targetStars;
      }
      return false;
    }

    function checkGameState() {
      if (hand.length === 0) return;
      const directFit = hand.some(p => {
        for (let r = 0; r < GRID_SIZE; r++) {
          for (let c = 0; c < GRID_SIZE; c++) {
            if (canPlace(p, r, c)) return true;
          }
        }
        return false;
      });
      if (!directFit) triggerGameOver();
    }

    function triggerWin() {
      gameLoopActive = false;
      if (bossTimerInterval) clearInterval(bossTimerInterval);
      localStorage.removeItem(`bb_autosave_${gameMode}`);

      playSoftTone(523.25, 0.2, 0.2);
      setTimeout(() => playSoftTone(659.25, 0.2, 0.2), 80);
      setTimeout(() => playSoftTone(783.99, 0.3, 0.2), 160);

      if (gameMode === "levels") {
        saveLevelCompleted(activeLevel);
        winSubtext.textContent = `المرحلة ${activeLevel} مكتملة! النقاط: ${score} | النجوم: ${starsCollected}`;
        nextLevelBtn.style.display = activeLevel < TOTAL_LEVELS ? "block" : "none";
      } else {
        winSubtext.textContent = `أنهيت لغز اليوم بنجاح وجمعت الشارة الذهبية ⭐`;
        nextLevelBtn.style.display = "none";
      }
      winModal.style.display = "flex";
    }

    function goToNextLevel() {
      winModal.style.display = "none";
      initAndCheckGuide("levels", activeLevel + 1);
    }

    function triggerGameOver() {
      isGameOverState = true;
      gameLoopActive = false;
      if (bossTimerInterval) clearInterval(bossTimerInterval);
      localStorage.removeItem(`bb_autosave_${gameMode}`);

      playSoftTone(140, 0.3, 0.3);
      triggerHaptic(70);

      reviveBtn.style.display = hasUsedRevive ? "none" : "block";
      setTimeout(() => {
        if (isGameOverState) lossControlBar.style.display = "flex";
      }, 1000);
    }

    function useRevive() {
      hasUsedRevive = true;
      isGameOverState = false;
      lossControlBar.style.display = "none";

      for (let r = 2; r <= 5; r++) {
        for (let c = 2; c <= 5; c++) grid[r][c] = 0;
      }

      gameLoopActive = true;
      if (currentConfig?.hasTimer || inEliteTest) startTimer();
      autoSaveCurrentMode();
      checkGameState();
    }

    function restartCurrentMode() {
      lossControlBar.style.display = "none";
      winModal.style.display = "none";
      isGameOverState = false;
      localStorage.removeItem(`bb_autosave_${gameMode}`);
      if (gameMode === "levels") startSpecificLevel(activeLevel);
      else startGame(gameMode);
    }

    // ==========================================
    // 10. اللمس الفائق مع الارتفاع والظهور الواضح
    // ==========================================
    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = 400 / rect.width;
      const scaleY = 700 / rect.height;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
    }

    canvas.addEventListener("touchstart", onDown, { passive: false });
    canvas.addEventListener("mousedown", onDown);
    window.addEventListener("touchmove", onMove, { passive: false });
    window.addEventListener("mousemove", onMove);
    window.addEventListener("touchend", onUp);
    window.addEventListener("mouseup", onUp);

    function onDown(e) {
      if (isGameOverState) { lossControlBar.style.display = "flex"; return; }
      if (!gameLoopActive) return;
      initAudio();
      const pos = getCanvasCoords(e);

      for (const piece of hand) {
        const w = (Math.max(...piece.blocks.map(b => b[1])) + 1) * piece.size;
        const h = (Math.max(...piece.blocks.map(b => b[0])) + 1) * piece.size;
        if (pos.x >= piece.x - 18 && pos.x <= piece.x + w + 18 &&
            pos.y >= piece.y - 18 && pos.y <= piece.y + h + 18) {
          draggedPiece = piece;
          piece.size = CELL_SIZE; // تكبير القطعة فوراً لمقاس اللوحة الحقيقي

          // توسيط القطعة أفقياً ورفعها 85px للأعلى لتكون واضحة بالكامل فوق الإصبع
          const fullW = (Math.max(...piece.blocks.map(b => b[1])) + 1) * CELL_SIZE;
          const fullH = (Math.max(...piece.blocks.map(b => b[0])) + 1) * CELL_SIZE;
          dragOffsetX = fullW / 2;
          dragOffsetY = fullH + 85;

          draggedPiece.x = pos.x - dragOffsetX;
          draggedPiece.y = pos.y - dragOffsetY;

          if (e.cancelable) e.preventDefault();
          break;
        }
      }
    }

    function onMove(e) {
      if (!draggedPiece) return;
      const pos = getCanvasCoords(e);
      draggedPiece.x = pos.x - dragOffsetX;
      draggedPiece.y = pos.y - dragOffsetY;

      const tc = Math.round((draggedPiece.x - GRID_OFFSET_X) / CELL_SIZE);
      const tr = Math.round((draggedPiece.y - GRID_OFFSET_Y) / CELL_SIZE);

      previewTarget = canPlace(draggedPiece, tr, tc) ? { r: tr, c: tc } : null;
      if (e.cancelable) e.preventDefault();
    }

    function onUp() {
      if (!draggedPiece) return;
      const tc = Math.round((draggedPiece.x - GRID_OFFSET_X) / CELL_SIZE);
      const tr = Math.round((draggedPiece.y - GRID_OFFSET_Y) / CELL_SIZE);

      if (canPlace(draggedPiece, tr, tc)) {
        placeAndProcess(draggedPiece, tr, tc);
      } else {
        draggedPiece.x = draggedPiece.origX;
        draggedPiece.y = draggedPiece.origY;
        draggedPiece.size = 19;
      }

      previewTarget = null;
      draggedPiece = null;
    }

    // ==========================================
    // 11. حلقة الرسم فائقة النقاء (Ultra Crisp Render)
    // ==========================================
    function draw() {
      ctx.clearRect(0, 0, 400, 700);
      const currentBiome = getCurrentBiome(activeLevel);

      // الشريط العلوي
      ctx.fillStyle = "#f8fafc";
      ctx.font = "bold 19px system-ui";
      ctx.textAlign = "right";
      ctx.fillText(`النقاط: ${score}`, 375, 42);

      ctx.fillStyle = "#94a3b8";
      ctx.font = "14px system-ui";
      ctx.textAlign = "left";
      ctx.fillText(`الأعلى: ${highScore}`, 25, 42);

      // نص الهدف
      ctx.fillStyle = currentBiome.text;
      ctx.font = "bold 14px system-ui";
      ctx.textAlign = "center";
      if (gameMode === "levels") {
        let str = currentConfig.goalType === "score"
          ? `المرحلة ${activeLevel}  |  الهدف: 🎯 ${score}/${currentConfig.targetScore}`
          : `المرحلة ${activeLevel}  |  الهدف: ⭐ ${starsCollected}/${currentConfig.targetStars}`;
        if (currentConfig.hasTimer) str += `  |  ⏱️ ${Math.floor(bossSecondsElapsed / 60)}:${bossSecondsElapsed % 60 < 10 ? '0' : ''}${bossSecondsElapsed % 60}`;
        ctx.fillText(str, 200, 75);
      } else if (gameMode === "daily") {
        ctx.fillText(`⭐ التحدي اليومي  |  🎯 ${score}/1200  •  ⭐ ${starsCollected}/5`, 200, 75);
      } else {
        ctx.fillText(`♾️ اللعب اللانهائي التكتيكي`, 200, 75);
      }

      // رسم شبكة اللعبة المريحة
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const x = GRID_OFFSET_X + c * CELL_SIZE;
          const y = GRID_OFFSET_Y + r * CELL_SIZE;
          const cell = grid[r][c];

          ctx.fillStyle = isGameOverState && cell === 0 ? currentBiome.blockedCell : cell ? (cell.color || cell) : currentBiome.emptyCell;
          ctx.beginPath();
          ctx.roundRect(x + 2, y + 2, CELL_SIZE - 4, CELL_SIZE - 4, 8);
          ctx.fill();

          if (cell && cell.hasGem) {
            ctx.fillStyle = "#ffffff";
            ctx.font = "18px system-ui";
            ctx.textAlign = "center";
            ctx.fillText(cell.isBomb ? "💣" : "⭐", x + CELL_SIZE / 2, y + CELL_SIZE / 2 + 6);
          } else if (cell && cell.isRock) {
            ctx.fillStyle = "#ffffff";
            ctx.font = "16px system-ui";
            ctx.textAlign = "center";
            ctx.fillText("🪨", x + CELL_SIZE / 2, y + CELL_SIZE / 2 + 6);
          }
        }
      }

      // شبح التنسيق
      if (draggedPiece && previewTarget && !isGameOverState) {
        ctx.fillStyle = "rgba(56, 189, 248, 0.35)";
        for (const [dr, dc] of draggedPiece.blocks) {
          const gx = GRID_OFFSET_X + (previewTarget.c + dc) * CELL_SIZE;
          const gy = GRID_OFFSET_Y + (previewTarget.r + dr) * CELL_SIZE;
          ctx.beginPath();
          ctx.roundRect(gx + 2, gy + 2, CELL_SIZE - 4, CELL_SIZE - 4, 8);
          ctx.fill();
        }
      }

      // رسم القطع
      hand.forEach(p => {
        if (p === draggedPiece) return;
        drawShape(p, isGameOverState ? 0.35 : 1.0);
      });

      if (draggedPiece) drawShape(draggedPiece, 1.0);

      requestAnimationFrame(draw);
    }

    function drawShape(piece, opacity = 1.0) {
      ctx.save();
      ctx.globalAlpha = opacity;
      ctx.fillStyle = piece.color;
      piece.blocks.forEach(([dr, dc], idx) => {
        const x = piece.x + dc * piece.size;
        const y = piece.y + dr * piece.size;
        ctx.beginPath();
        ctx.roundRect(x + 1, y + 1, piece.size - 2, piece.size - 2, 7);
        ctx.fill();

        if (piece.starBlockIndex === idx) {
          ctx.fillStyle = "#ffffff";
          ctx.font = `${Math.floor(piece.size * 0.65)}px system-ui`;
          ctx.textAlign = "center";
          ctx.fillText("⭐", x + piece.size / 2, y + piece.size / 2 + (piece.size * 0.22));
          ctx.fillStyle = piece.color;
        }
      });
      ctx.restore();
    }

    draw();
  </script>
