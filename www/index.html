<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>musab sw</title>
  
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      overscroll-behavior: none; background: #000; 
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden; color: #f8fafc; width: 100vw; height: 100vh; touch-action: none;
      display: flex; justify-content: center; align-items: center;
    }

    #gameContainer {
      position: relative; width: 100%; max-width: 450px; height: 100vh;
      background: radial-gradient(circle at center, #1e1b4b 0%, #020617 100%);
      overflow: hidden; box-shadow: 0 0 30px rgba(0,0,0,0.8);
    }

    #splashScreen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, #0f172a 0%, #312e81 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 9999; transition: opacity 0.5s ease;
    }
    .splash-logo { font-size: 5rem; margin-bottom: 15px; animation: pulse 1.5s infinite alternate; }
    @keyframes pulse { 0% { transform: scale(0.9); } 100% { transform: scale(1.1); } }
    .splash-title { font-size: 3.5rem; font-weight: 900; color: #38bdf8; text-shadow: 0 4px 15px rgba(0,0,0,0.6); }

    canvas { display: block; width: 100%; height: 100%; touch-action: none; }

    #adBannerContainer {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 50px;
      background: #090d16; border-top: 1px solid #1e293b;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem; color: #64748b; z-index: 50;
    }
    .ad-badge { border: 1px solid #475569; padding: 2px 6px; border-radius: 4px; margin-left: 8px; color: #94a3b8; }

    .top-nav-btn {
      position: absolute; top: 15px;
      background: rgba(30, 41, 59, 0.85); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 14px; color: #fff; font-size: 1.4rem; cursor: pointer; pointer-events: auto;
      z-index: 2000; display: flex; align-items: center; justify-content: center;
      width: 42px; height: 42px; backdrop-filter: blur(10px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.4); transition: transform 0.1s;
    }
    .top-nav-btn:active { transform: scale(0.9); }
    #backTopBtn { left: 20px; }       
    #settingsTopBtn { right: 20px; }  

    .modal {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
      display: none; flex-direction: column; align-items: center; justify-content: center;
      z-index: 1000; padding: 20px; text-align: center; background: rgba(2, 6, 23, 0.85);
    }
    .dialog-card {
      background: linear-gradient(145deg, #1e293b, #0f172a); border: 1px solid #334155;
      border-radius: 30px; padding: 30px 20px; width: 92%; max-width: 340px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.9);
    }

    .btn {
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%); border: none; border-bottom: 4px solid #0369a1; color: white;
      padding: 16px 20px; font-size: 1.15rem; border-radius: 20px; cursor: pointer; font-weight: 800; margin: 8px 0; width: 100%;
      box-shadow: 0 8px 20px rgba(2,132,199,0.4); transition: transform 0.1s;
    }
    .btn:active { transform: translateY(4px); border-bottom-width: 0px; }
    .btn-gold { background: linear-gradient(180deg, #fbbf24 0%, #d97706 100%); border-bottom-color: #b45309; box-shadow: 0 8px 20px rgba(217,119,6,0.4); }
    .btn-secondary { background: linear-gradient(180deg, #475569 0%, #334155 100%); border-bottom-color: #1e293b; box-shadow: 0 8px 20px rgba(0,0,0,0.4); }

    #mapModal { background: #0f172a; justify-content: flex-start; padding-top: 30px; }
    .map-header { display: flex; justify-content: space-between; align-items: center; width: 100%; border-bottom: 2px solid #334155; padding-bottom: 15px; margin-bottom: 15px; }
    .levels-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; max-height: 65vh; overflow-y: auto; padding-right: 5px; }
    .level-node { background: #1e293b; border: 2px solid #334155; border-radius: 18px; padding: 15px 5px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
    .level-node.unlocked { border-color: #38bdf8; background: #0369a1; }
    .level-node.boss-level { border-color: #f43f5e; background: #be123c; }
    .level-num { font-size: 1.3rem; font-weight: 900; color: #fff; }
    
    .setting-row { display: flex; justify-content: space-between; align-items: center; margin: 20px 0; font-size: 1.1rem; font-weight: 700; }
  </style>
</head>
<body>

  <div id="gameContainer">
    <div id="splashScreen">
      <div class="splash-logo">💎</div>
      <div class="splash-title">musab sw</div>
    </div>

    <button id="backTopBtn" class="top-nav-btn" onclick="handleHardwareBack()" title="رجوع">❮</button>
    <button id="settingsTopBtn" class="top-nav-btn" onclick="openSettings()" title="الإعدادات">⚙️</button>

    <canvas id="gameCanvas"></canvas>

    <div id="adBannerContainer">
      <span class="ad-badge">إعلان</span>
      <span id="bannerStatusText">جاري تحميل البانر...</span>
    </div>

    <div id="startModal" class="modal" style="display:flex;">
      <div style="font-size: 4.5rem; margin-bottom: 10px;">🧩</div>
      <h1 style="font-size: 3rem; font-weight: 900; color: #38bdf8; margin-bottom: 30px;">musab sw</h1>
      <button class="btn btn-gold" onclick="openLevelMap()">🗺️ خريطة المراحل (200)</button>
      <button class="btn btn-secondary" onclick="startGame('classic')">♾️ اللعب اللانهائي</button>
    </div>

    <div id="settingsModal" class="modal">
      <div class="dialog-card">
        <h2 style="font-size: 1.6rem; color: #38bdf8; margin-bottom: 20px;">⚙️ الإعدادات</h2>
        
        <div class="setting-row"><span>🔊 المؤثرات الصوتية</span><input type="checkbox" id="soundToggle" onchange="toggleSound(this.checked)" style="transform: scale(1.5);"></div>
        <div class="setting-row"><span>📳 الاهتزاز التكتيكي</span><input type="checkbox" id="hapticToggle" onchange="toggleHaptic(this.checked)" style="transform: scale(1.5);"></div>
        
        <button class="btn btn-gold" style="margin: 15px 0 10px 0; font-size: 1rem; padding: 12px;" onclick="closeSettings(); askForRestart();">🔄 إعادة المرحلة الحالية</button>

        <button class="btn" style="margin-top: 10px;" onclick="closeSettings()">حفظ وإغلاق 👍</button>
      </div>
    </div>

    <div id="confirmRestartModal" class="modal">
      <div class="dialog-card">
        <h2 style="font-size: 1.5rem; color: #fff; margin-bottom: 15px;">🔄 إعادة التعيين</h2>
        <p style="color: #94a3b8; margin-bottom: 25px;">هل تريد مسح الشبكة والبدء من جديد؟</p>
        <button class="btn btn-gold" onclick="confirmRestartExecution()">نعم 🔄</button>
        <button class="btn btn-secondary" onclick="cancelRestartDialog()">إلغاء ❌</button>
      </div>
    </div>

    <div id="mapModal" class="modal">
      <div class="map-header">
        <h2 style="font-size: 1.5rem; font-weight: 800; color: #fff;">خريطة المراحل</h2>
      </div>
      <div class="levels-grid" id="levelsGridContainer"></div>
      <button class="btn btn-secondary" style="margin-top: 20px;" onclick="closeLevelMap()">العودة للقائمة</button>
    </div>

    <div id="winModal" class="modal">
      <div style="font-size: 4rem; margin-bottom: 10px;">🏆</div>
      <h2 style="font-size: 2.5rem; font-weight: 900; color: #38bdf8; margin-bottom: 15px;">رائع!</h2>
      <p id="winSubtext" style="font-size: 1.1rem; color: #cbd5e1; margin-bottom: 30px;"></p>
      <button id="nextLevelBtn" class="btn" onclick="goToNextLevel()">المرحلة التالية ⏭️</button>
      <button class="btn btn-secondary" onclick="openLevelMapFromGame()">خريطة المراحل</button>
    </div>

    <div id="lossControlBar" class="modal">
      <div class="dialog-card">
        <div style="font-size: 3.5rem; margin-bottom: 10px;">⚠️</div>
        <h2 style="font-size: 1.6rem; font-weight: 900; color: #f43f5e; margin-bottom: 10px;">اللوح ممتلئ!</h2>
        <p style="color: #94a3b8; margin-bottom: 25px;">لا توجد مساحة كافية للتحرك</p>
        <button id="reviveAdBtn" class="btn" onclick="watchRealAdForRevive()">📺 مشاهدة إعلان للإنقاذ</button>
        <button class="btn btn-gold" onclick="restartCurrentMode()">إعادة من الصفر 🔄</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { AdMob, BannerAdPosition, BannerAdSize } from '@capacitor-community/admob';
    import { StatusBar } from '@capacitor/status-bar';

    // إخفاء شريط الإشعارات لضمان وضع ملء الشاشة المطلق
    try {
      await StatusBar.hide();
    } catch (e) {}

    async function initAdMobSDK() {
      try {
        await AdMob.initialize({ requestTrackingAuthorization: true });
        await AdMob.showBanner({ adId: 'ca-app-pub-8587982696741860/6049288587', position: BannerAdPosition.BOTTOM_CENTER, size: BannerAdSize.BANNER, margin: 0, isTesting: false });
        document.getElementById("bannerStatusText").style.display = "none";
      } catch (e) { document.getElementById("bannerStatusText").textContent = "Google AdMob Space"; }
    }
    initAdMobSDK();
    window.watchRealAdForRevive = async function() {
      window.initAudio();
      try {
        await AdMob.prepareRewardVideoAd({ adId: 'ca-app-pub-8587982696741860/7846797435', isTesting: false });
        const reward = await AdMob.showRewardVideoAd();
        if (reward) window.executeRevive();
      } catch (e) { window.executeRevive(); }
    };
  </script>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let INTERNAL_W = 400, INTERNAL_H = 720;
    let GRID_OFFSET_X = 24, GRID_OFFSET_Y = 135; 
    const GRID_SIZE = 8, CELL_SIZE = 44;

    let gameMode = "classic", activeLevel = 1, score = 0, redGemsCollected = 0, blueGemsCollected = 0;
    let grid = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(0));
    let hand = [], draggedPiece = null, previewTarget = null;
    let dragOffsetX = 0, dragOffsetY = 0, reviveCount = 0;
    let gameLoopActive = false, isGameOverState = false;
    let highScore = parseInt(localStorage.getItem("msw_high_score")) || 0;
    let currentConfig = null;
    let audioCtx = null;
    
    let bossSecondsElapsed = 0, heartbeatTimerInterval = null, inStrategicMode = false;

    let userSettings = JSON.parse(localStorage.getItem("msw_settings")) || { sound: true, haptic: true };
    document.getElementById("soundToggle").checked = userSettings.sound;
    document.getElementById("hapticToggle").checked = userSettings.haptic;

    const PALETTES = [ { base: "#3b82f6", light: "#60a5fa", dark: "#1d4ed8" }, { base: "#10b981", light: "#34d399", dark: "#059669" }, { base: "#f59e0b", light: "#fbbf24", dark: "#b45309" }, { base: "#8b5cf6", light: "#a78bfa", dark: "#6d28d9" } ];
    
    const ALL_SHAPES = [
      { id: "dot", weight: 1, blocks: [[0, 0]] }, 
      { id: "line2h", weight: 14, blocks: [[0, 0], [0, 1]] },
      { id: "line2v", weight: 14, blocks: [[0, 0], [1, 0]] },
      { id: "line3h", weight: 10, blocks: [[0, 0], [0, 1], [0, 2]] },
      { id: "line3v", weight: 10, blocks: [[0, 0], [1, 0], [2, 0]] },
      { id: "sq2", weight: 8, blocks: [[0, 0], [0, 1], [1, 0], [1, 1]] },
      { id: "l", weight: 7, blocks: [[0, 0], [1, 0], [2, 0], [2, 1]] },
      { id: "t", weight: 7, blocks: [[0, 1], [1, 0], [1, 1], [1, 2]] }
    ];

    window.addEventListener('load', () => {
      setTimeout(() => { const splash = document.getElementById("splashScreen"); if(splash) { splash.style.opacity = "0"; setTimeout(() => splash.remove(), 600); } }, 1000);
    });

    function updateHandPositions() {
      const PREVIEW_SIZE = 22; const slotWidth = INTERNAL_W / 3;
      hand.forEach((p, idx) => {
        const shapeW = (Math.max(...p.blocks.map(b => b[1])) + 1) * PREVIEW_SIZE;
        const shapeH = (Math.max(...p.blocks.map(b => b[0])) + 1) * PREVIEW_SIZE;
        p.origX = slotWidth * idx + slotWidth / 2 - shapeW / 2;
        p.origY = INTERNAL_H - shapeH - (INTERNAL_H * 0.12);
        if (!draggedPiece || draggedPiece !== p) { p.x = p.origX; p.y = p.origY; }
      });
    }

    function resizeCanvas() {
      const container = document.getElementById("gameContainer");
      const rect = container.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      INTERNAL_W = 400; INTERNAL_H = 400 * (rect.height / rect.width);
      canvas.width = INTERNAL_W * dpr; canvas.height = INTERNAL_H * dpr; ctx.scale(dpr, dpr);
      
      GRID_OFFSET_X = (INTERNAL_W - (GRID_SIZE * CELL_SIZE)) / 2; 
      GRID_OFFSET_Y = (INTERNAL_H - (GRID_SIZE * CELL_SIZE)) / 2 - 15; 
      
      if(hand && hand.length > 0) updateHandPositions();
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    window.toggleSound = function(val) { userSettings.sound = val; localStorage.setItem("msw_settings", JSON.stringify(userSettings)); }
    window.toggleHaptic = function(val) { userSettings.haptic = val; localStorage.setItem("msw_settings", JSON.stringify(userSettings)); }

    window.initAudio = function() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
    function playSound(type) {
      if (!userSettings.sound || !audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        if (type === 'pickup' || type === 'drop') {
          const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
          osc.type = 'triangle'; osc.frequency.setValueAtTime(type==='pickup'?400:200, now);
          osc.frequency.exponentialRampToValueAtTime(type==='pickup'?600:100, now + 0.05);
          gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.05);
        } else if (type === 'clear') {
          const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
          osc.type = 'sine'; osc.frequency.setValueAtTime(500, now); osc.frequency.exponentialRampToValueAtTime(1200, now + 0.3);
          gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'heartbeat') { 
          const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
          osc.type = 'sine'; osc.frequency.setValueAtTime(65, now); osc.frequency.exponentialRampToValueAtTime(35, now + 0.1);
          gain.gain.setValueAtTime(0.4, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
          osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.1);
        }
      } catch (e) {}
    }
    function triggerHaptic(ms = 25) { if (userSettings.haptic && navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} } }

    window.handleHardwareBack = function() {
      if(document.getElementById('mapModal').style.display === "flex") { closeLevelMap(); return; }
      if(document.getElementById('settingsModal').style.display === "flex") { closeSettings(); return; }
      if(document.getElementById('confirmRestartModal').style.display === "flex") { cancelRestartDialog(); return; }
      if(gameLoopActive || isGameOverState) {
          gameLoopActive = false; isGameOverState = false; stopHeartbeatEngine();
          document.getElementById('winModal').style.display = "none";
          document.getElementById('lossControlBar').style.display = "none";
          document.getElementById('startModal').style.display = "flex";
      }
    }

    window.openSettings = function() { document.getElementById('settingsModal').style.display = "flex"; }
    window.closeSettings = function() { document.getElementById('settingsModal').style.display = "none"; }
    window.askForRestart = function() { if(gameLoopActive || isGameOverState) document.getElementById('confirmRestartModal').style.display = "flex"; }
    window.cancelRestartDialog = function() { document.getElementById('confirmRestartModal').style.display = "none"; }
    window.confirmRestartExecution = function() { cancelRestartDialog(); restartCurrentMode(); }

    window.renderMapGrid = function() {
      const container = document.getElementById("levelsGridContainer"); container.innerHTML = "";
      for (let i = 1; i <= 200; i++) {
        let req = 500 + (i * 150); 
        if (i%5===0) req = 800 + (i * 200);
        let badge = (i%5===0)?`⏱️ ${req}🎯`:((i%3===1)?`💎 ${4+Math.floor(i*0.15)}`:((i%3===2)?`🔷 ${4+Math.floor(i*0.15)}`:`🎯 ${req}`));
        const node = document.createElement("div"); node.className = `level-node unlocked ${(i%5===0)?"boss-level":""}`;
        node.innerHTML = `<div class="level-num">${(i%5===0)?"🔥"+i:i}</div><div style="font-size:0.65rem; color:#bae6fd; font-weight:700;">${badge}</div>`;
        node.onclick = () => startSpecificLevel(i); container.appendChild(node);
      }
    }
    window.openLevelMap = function() { document.getElementById('startModal').style.display = "none"; renderMapGrid(); document.getElementById('mapModal').style.display = "flex"; }
    window.closeLevelMap = function() { document.getElementById('mapModal').style.display = "none"; document.getElementById('startModal').style.display = "flex"; }
    window.openLevelMapFromGame = function() { gameLoopActive=false; stopHeartbeatEngine(); document.getElementById('winModal').style.display="none"; document.getElementById('lossControlBar').style.display="none"; openLevelMap(); }

    function canPlace(shape, r0, c0) {
      for (const [dr, dc] of shape.blocks) {
        const r = r0 + dr, c = c0 + dc;
        if (r < 0 || r >= GRID_SIZE || c < 0 || c >= GRID_SIZE || grid[r][c] !== 0) return false;
      }
      return true;
    }
    
    function getWeightedRandomShape() {
        let totalWeight = ALL_SHAPES.reduce((sum, s) => sum + s.weight, 0);
        let rand = Math.random() * totalWeight;
        for (let shape of ALL_SHAPES) {
            if (rand < shape.weight) return JSON.parse(JSON.stringify(shape));
            rand -= shape.weight;
        }
        return JSON.parse(JSON.stringify(ALL_SHAPES[1]));
    }

    function analyzeBoardForSmartDrop() {
        let needsHelper = false;
        for(let r=0; r<GRID_SIZE; r++) {
            let filledCount = grid[r].filter(c => c !== 0).length;
            if(filledCount === GRID_SIZE - 1) needsHelper = true;
        }
        for(let c=0; c<GRID_SIZE; c++) {
            let filledCount = 0;
            for(let r=0; r<GRID_SIZE; r++) if(grid[r][c] !== 0) filledCount++;
            if(filledCount === GRID_SIZE - 1) needsHelper = true;
        }
        return needsHelper;
    }

    function generateHand() {
      hand = []; const PREVIEW_SIZE = 22;
      let targetGem = (gameMode==="levels" && currentConfig) ? (currentConfig.reqRedGems>redGemsCollected?'red':(currentConfig.reqBlueGems>blueGemsCollected?'blue':null)) : null;
      const gemIdx = targetGem ? Math.floor(Math.random()*3) : -1;
      
      let boardNeedsHelp = analyzeBoardForSmartDrop();

      for (let i = 0; i < 3; i++) {
        let p;
        if (i === 0 && boardNeedsHelp && Math.random() > 0.5) {
             let helpers = ALL_SHAPES.filter(s => s.id === "line2h" || s.id === "line2v");
             p = JSON.parse(JSON.stringify(helpers[Math.floor(Math.random() * helpers.length)]));
        } else {
             p = getWeightedRandomShape();
        }

        p.colorData = PALETTES[Math.floor(Math.random() * PALETTES.length)];
        p.size = PREVIEW_SIZE; p.gemType = (i === gemIdx) ? targetGem : null;
        p.gemBlockIndex = (i === gemIdx) ? Math.floor(Math.random() * p.blocks.length) : -1;
        hand.push(p);
      }
      
      let canPlayAny = hand.some(p => { for(let r=0;r<GRID_SIZE;r++) for(let c=0;c<GRID_SIZE;c++) if(canPlace(p,r,c)) return true; return false; });
      if(!canPlayAny) {
          let hasEmptySpace = false;
          for(let r=0;r<GRID_SIZE;r++) for(let c=0;c<GRID_SIZE;c++) if(grid[r][c] === 0) hasEmptySpace = true;
          if(hasEmptySpace) {
              let rescueShape = JSON.parse(JSON.stringify(ALL_SHAPES.find(s => s.id === "dot"))); 
              rescueShape.colorData = PALETTES[0]; rescueShape.size = PREVIEW_SIZE; rescueShape.gemType = null; rescueShape.gemBlockIndex = -1;
              hand[0] = rescueShape;
          }
      }

      updateHandPositions();
      checkGameOver();
    }

    function checkGameOver() {
      if(hand.length===0) return;
      const directFit = hand.some(p => { for(let r=0;r<GRID_SIZE;r++) for(let c=0;c<GRID_SIZE;c++) if(canPlace(p,r,c)) return true; return false; });
      
      if(!directFit) { 
        gameLoopActive = false; 
        stopHeartbeatEngine();
        setTimeout(() => {
            isGameOverState = true; 
            document.getElementById('lossControlBar').style.display = "flex"; 
            triggerHaptic(60); 
            document.getElementById('reviveAdBtn').style.display=(reviveCount<1)?"block":"none"; 
        }, 1500);
      }
    }

    function stopHeartbeatEngine() {
      if (heartbeatTimerInterval) { clearInterval(heartbeatTimerInterval); heartbeatTimerInterval = null; }
    }

    function startTimedEngine() {
      stopHeartbeatEngine();
      heartbeatTimerInterval = setInterval(() => {
        if (!gameLoopActive || !currentConfig || !currentConfig.hasTimer || inStrategicMode) {
          if (!currentConfig || !currentConfig.hasTimer) stopHeartbeatEngine();
          return;
        }
        bossSecondsElapsed++;
        if (bossSecondsElapsed >= 105 && bossSecondsElapsed <= 120) { playSound('heartbeat'); triggerHaptic(15); }
        if (bossSecondsElapsed >= 120) { inStrategicMode = true; stopHeartbeatEngine(); triggerHaptic(40); }
      }, 1000);
    }

    window.executeRevive = function() {
      reviveCount++; isGameOverState = false; document.getElementById('lossControlBar').style.display = "none";
      for (let r = 2; r <= 5; r++) for (let c = 2; c <= 5; c++) grid[r][c] = 0;
      gameLoopActive = true; 
      if (currentConfig && currentConfig.hasTimer && !inStrategicMode) startTimedEngine();
      generateHand();
    }

    window.restartCurrentMode = function() {
      document.getElementById('lossControlBar').style.display="none"; document.getElementById('winModal').style.display="none"; isGameOverState=false; stopHeartbeatEngine();
      if (gameMode === "classic") startGame("classic"); else startSpecificLevel(activeLevel);
    }

    function startSpecificLevel(lvl) {
      gameMode = "levels"; activeLevel = lvl; score = redGemsCollected = blueGemsCollected = reviveCount = 0;
      bossSecondsElapsed = 0; inStrategicMode = false;

      let reqRed=0, reqBlue=0, reqScore=500+(lvl*150), hasTimer=false;
      if(lvl === 1) {
          reqScore = 500; 
      } else if(lvl%5===0) { 
          hasTimer=true; 
          reqScore = 800+(lvl*200); 
      } else if(lvl%3===1) { 
          reqRed = 4+Math.floor(lvl*0.15); 
      } else if(lvl%3===2) { 
          reqBlue = 4+Math.floor(lvl*0.15); 
      }
      
      currentConfig = { reqScore, reqRedGems:reqRed, reqBlueGems:reqBlue, hasTimer };
      grid = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(0));
      
      let difficultyFactor = (lvl % 4 === 0) ? 0.2 : 1.0;
      let prefilledAmount = Math.floor(Math.min(10, Math.floor(lvl / 3.5)) * difficultyFactor); 
      
      for(let i=0; i<prefilledAmount; i++) {
          let r = Math.floor(Math.random()*8), c = Math.floor(Math.random()*8);
          if(grid[r][c] === 0) grid[r][c] = {colorData: PALETTES[3]}; 
      }

      let placedReds = 0;
      while (placedReds < Math.min(4, reqRed)) {
          let r = Math.floor(Math.random()*8), c = Math.floor(Math.random()*8);
          if(grid[r][c] === 0) { grid[r][c]={colorData:PALETTES[1], gem:'red'}; placedReds++; }
      }
      let placedBlues = 0;
      while (placedBlues < Math.min(4, reqBlue)) {
          let r = Math.floor(Math.random()*8), c = Math.floor(Math.random()*8);
          if(grid[r][c] === 0) { grid[r][c]={colorData:PALETTES[0], gem:'blue'}; placedBlues++; }
      }

      document.getElementById('mapModal').style.display = "none"; document.getElementById('startModal').style.display = "none";
      gameLoopActive = true; 
      if(hasTimer) startTimedEngine();
      generateHand();
    }

    window.startGame = function(mode) {
      gameMode = mode; score = reviveCount = 0; currentConfig = null; bossSecondsElapsed = 0; inStrategicMode = false;
      grid = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(0));
      document.getElementById('startModal').style.display = "none"; gameLoopActive = true; generateHand();
    }
    window.goToNextLevel = function() { document.getElementById('winModal').style.display = "none"; startSpecificLevel(activeLevel + 1); }

    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = INTERNAL_W / rect.width; 
      const scaleY = INTERNAL_H / rect.height;
      const clientX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches && e.touches.length > 0 ? e.touches[0].clientY : e.clientY;
      return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
    }

    function handleDown(e) {
      if(!gameLoopActive) return; window.initAudio(); const pos = getCanvasCoords(e);
      let closest = null, minDist = 70;
      hand.forEach(p=>{ const w = (Math.max(...p.blocks.map(b=>b[1]))+1)*p.size, h = (Math.max(...p.blocks.map(b=>b[0]))+1)*p.size;
        const dist = Math.hypot(pos.x - (p.x+w/2), pos.y - (p.y+h/2));
        if(dist<minDist){ minDist=dist; closest=p; }
      });
      if(closest){ draggedPiece=closest; draggedPiece.size=CELL_SIZE; playSound('pickup'); triggerHaptic(15);
        dragOffsetX = ((Math.max(...draggedPiece.blocks.map(b=>b[1]))+1)*CELL_SIZE)/2;
        dragOffsetY = ((Math.max(...draggedPiece.blocks.map(b=>b[0]))+1)*CELL_SIZE)+80;
        draggedPiece.x = pos.x - dragOffsetX; draggedPiece.y = pos.y - dragOffsetY;
        if(e.cancelable) e.preventDefault();
      }
    }
    canvas.addEventListener("touchstart", handleDown, {passive:false});
    canvas.addEventListener("mousedown", handleDown);

    function handleMove(e) {
      if(!draggedPiece) return; if(e.cancelable) e.preventDefault();
      const pos = getCanvasCoords(e); draggedPiece.x = pos.x - dragOffsetX; draggedPiece.y = pos.y - dragOffsetY;
      const tc = Math.round((draggedPiece.x - GRID_OFFSET_X)/CELL_SIZE), tr = Math.round((draggedPiece.y - GRID_OFFSET_Y)/CELL_SIZE);
      previewTarget = canPlace(draggedPiece, tr, tc) ? {r:tr, c:tc} : null;
    }
    canvas.addEventListener("touchmove", handleMove, {passive:false});
    canvas.addEventListener("mousemove", handleMove);

    function handleUp(e) {
      if(!draggedPiece) return; if(e && e.cancelable) e.preventDefault();
      const tc = Math.round((draggedPiece.x - GRID_OFFSET_X)/CELL_SIZE), tr = Math.round((draggedPiece.y - GRID_OFFSET_Y)/CELL_SIZE);
      if(canPlace(draggedPiece, tr, tc)){
        draggedPiece.blocks.forEach(([dr, dc], i)=>{ grid[tr+dr][tc+dc] = (draggedPiece.gemBlockIndex===i) ? {colorData:draggedPiece.colorData, gem:draggedPiece.gemType} : {colorData:draggedPiece.colorData}; });
        
        let pointsEarned = draggedPiece.blocks.length * 5;
        if (inStrategicMode) pointsEarned *= 2;
        score += pointsEarned;

        let rows=[], cols=[];
        for(let r=0;r<GRID_SIZE;r++) if(grid[r].every(c=>c!==0)) rows.push(r);
        for(let c=0;c<GRID_SIZE;c++) if(grid.every(row=>row[c]!==0)) cols.push(c);
        
        if(rows.length+cols.length > 0){
          triggerHaptic(50); playSound('clear');
          rows.forEach(r=>{ for(let c=0;c<GRID_SIZE;c++){ if(grid[r][c]&&grid[r][c].gem==='red')redGemsCollected++; if(grid[r][c]&&grid[r][c].gem==='blue')blueGemsCollected++; grid[r][c]=0; }});
          cols.forEach(c=>{ for(let r=0;r<GRID_SIZE;r++){ if(grid[r][c]&&grid[r][c].gem==='red')redGemsCollected++; if(grid[r][c]&&grid[r][c].gem==='blue')blueGemsCollected++; grid[r][c]=0; }});
          
          let lines = rows.length + cols.length;
          let lineScore = lines * 150; 
          if (lines > 1) lineScore += (lines - 1) * 150;
          if (inStrategicMode) lineScore *= 2;
          score += lineScore;
        } else playSound('drop');

        if(score>highScore) { highScore = score; localStorage.setItem("msw_high_score", highScore); }
        hand = hand.filter(p=>p!==draggedPiece);
        
        if(gameMode==="levels" && currentConfig && (currentConfig.reqRedGems===0||redGemsCollected>=currentConfig.reqRedGems) && (currentConfig.reqBlueGems===0||blueGemsCollected>=currentConfig.reqBlueGems) && (currentConfig.reqScore===0||score>=currentConfig.reqScore)){
          gameLoopActive=false; stopHeartbeatEngine(); triggerHaptic(60); document.getElementById('winSubtext').textContent=`مرحلة ${activeLevel} اكتملت بنجاح!`; document.getElementById('winModal').style.display="flex"; return;
        }
        
        if(hand.length===0) generateHand(); else checkGameOver();
      } else { draggedPiece.x=draggedPiece.origX; draggedPiece.y=draggedPiece.origY; draggedPiece.size=22; }
      previewTarget=null; draggedPiece=null;
    }
    canvas.addEventListener("touchend", handleUp, {passive:false});
    canvas.addEventListener("mouseup", handleUp);

    function draw3DBlock(x, y, s, color) {
      ctx.save(); ctx.fillStyle="rgba(0,0,0,0.4)"; ctx.beginPath(); ctx.roundRect(x+2, y+4, s-3, s-3, 6); ctx.fill();
      ctx.fillStyle=color.base; ctx.beginPath(); ctx.roundRect(x+1, y+1, s-3, s-3, 6); ctx.fill();
      ctx.fillStyle=color.dark; ctx.beginPath(); ctx.roundRect(x+1, y+s-9, s-3, 6, [0,0,6,6]); ctx.fill();
      ctx.fillStyle=color.light; ctx.beginPath(); ctx.roundRect(x+1, y+1, s-3, 5, [6,6,0,0]); ctx.fill(); ctx.restore();
    }

    function draw() {
      ctx.clearRect(0,0,INTERNAL_W,INTERNAL_H);
      ctx.save(); ctx.textAlign="center";
      
      const TEXT_POS_Y = GRID_OFFSET_Y - 25;

      if(gameMode==="levels" && currentConfig){
        if (currentConfig.hasTimer) {
            if (!inStrategicMode) {
                const mins = Math.floor(bossSecondsElapsed / 60); const secs = bossSecondsElapsed % 60;
                ctx.fillStyle = (bossSecondsElapsed >= 105) ? "#f43f5e" : "#38bdf8"; ctx.font="900 18px system-ui";
                ctx.fillText(`⏱️ ${mins}:${secs < 10 ? '0' : ''}${secs}`, INTERNAL_W/2 - 70, TEXT_POS_Y);
            } else {
                ctx.fillStyle = "#fbbf24"; ctx.font="900 16px system-ui";
                ctx.fillText("🧠 استراتيجي!", INTERNAL_W/2 - 70, TEXT_POS_Y);
            }
            ctx.fillStyle="#fff"; ctx.font="900 20px system-ui"; ctx.fillText(`🎯 ${score}/${currentConfig.reqScore}`, INTERNAL_W/2 + 65, TEXT_POS_Y);
        } else if(currentConfig.reqRedGems>0 || currentConfig.reqBlueGems>0){
          // التعديل الذكي هنا: عرض العداد المطلوب فقط وعدم إظهار الـ 0 للنوع غير المطلوب
          if (currentConfig.reqRedGems > 0 && currentConfig.reqBlueGems > 0) {
              ctx.fillStyle="#f43f5e"; ctx.font="900 18px system-ui"; ctx.fillText(`💎 ${Math.max(0, currentConfig.reqRedGems-redGemsCollected)}`, INTERNAL_W/2 - 50, TEXT_POS_Y);
              ctx.fillStyle="#38bdf8"; ctx.font="900 18px system-ui"; ctx.fillText(`🔷 ${Math.max(0, currentConfig.reqBlueGems-blueGemsCollected)}`, INTERNAL_W/2 + 50, TEXT_POS_Y);
          } else if (currentConfig.reqRedGems > 0) {
              ctx.fillStyle="#f43f5e"; ctx.font="900 20px system-ui"; ctx.fillText(`💎 ${Math.max(0, currentConfig.reqRedGems-redGemsCollected)}`, INTERNAL_W/2, TEXT_POS_Y);
          } else if (currentConfig.reqBlueGems > 0) {
              ctx.fillStyle="#38bdf8"; ctx.font="900 20px system-ui"; ctx.fillText(`🔷 ${Math.max(0, currentConfig.reqBlueGems-blueGemsCollected)}`, INTERNAL_W/2, TEXT_POS_Y);
          }
        } else { ctx.fillStyle="#fff"; ctx.font="900 22px system-ui"; ctx.fillText(`الهدف: ${score}/${currentConfig.reqScore}`, INTERNAL_W/2, TEXT_POS_Y); }
      } else if (gameMode==="classic") {
        ctx.fillStyle="#fff"; ctx.font="900 26px system-ui"; ctx.fillText(`${score}`, INTERNAL_W/2, TEXT_POS_Y - 5);
        ctx.fillStyle="#94a3b8"; ctx.font="700 13px system-ui"; ctx.fillText(`🏆 الأعلى: ${highScore}`, INTERNAL_W/2, TEXT_POS_Y + 20);
      }
      ctx.restore();

      ctx.fillStyle="#1e293b"; ctx.beginPath(); ctx.roundRect(GRID_OFFSET_X-6, GRID_OFFSET_Y-6, GRID_SIZE*CELL_SIZE+12, GRID_SIZE*CELL_SIZE+12, 16); ctx.fill();
      for(let r=0;r<GRID_SIZE;r++) for(let c=0;c<GRID_SIZE;c++){
        const x=GRID_OFFSET_X+c*CELL_SIZE, y=GRID_OFFSET_Y+r*CELL_SIZE;
        if(!grid[r][c]) { ctx.fillStyle="#0f172a"; ctx.beginPath(); ctx.roundRect(x+1, y+1, CELL_SIZE-2, CELL_SIZE-2, 6); ctx.fill(); }
        else { draw3DBlock(x,y,CELL_SIZE,grid[r][c].colorData); if(grid[r][c].gem){ ctx.fillStyle="#fff"; ctx.font="20px system-ui"; ctx.textAlign="center"; ctx.fillText(grid[r][c].gem==='red'?"💎":"🔷", x+CELL_SIZE/2, y+CELL_SIZE/2+7); } }
      }

      if(draggedPiece && previewTarget){ ctx.save(); ctx.globalAlpha=0.4; draggedPiece.blocks.forEach(([dr,dc])=>{ draw3DBlock(GRID_OFFSET_X+(previewTarget.c+dc)*CELL_SIZE, GRID_OFFSET_Y+(previewTarget.r+dr)*CELL_SIZE, CELL_SIZE, draggedPiece.colorData); }); ctx.restore(); }
      hand.forEach(p=>{ if(p!==draggedPiece) { p.blocks.forEach(([dr,dc],i)=>{ draw3DBlock(p.x+dc*p.size, p.y+dr*p.size, p.size, p.colorData); if(p.gemType&&p.gemBlockIndex===i){ ctx.fillStyle="#fff"; ctx.font=`${p.size*0.7}px system-ui`; ctx.textAlign="center"; ctx.fillText(p.gemType==='red'?"💎":"🔷", p.x+dc*p.size+p.size/2, p.y+dr*p.size+p.size*0.75); }}); }});
      if(draggedPiece) draggedPiece.blocks.forEach(([dr,dc],i)=>{ draw3DBlock(draggedPiece.x+dc*draggedPiece.size, draggedPiece.y+dr*draggedPiece.size, draggedPiece.size, draggedPiece.colorData); if(draggedPiece.gemType&&draggedPiece.gemBlockIndex===i){ ctx.fillStyle="#fff"; ctx.font=`${draggedPiece.size*0.7}px system-ui`; ctx.textAlign="center"; ctx.fillText(draggedPiece.gemType==='red'?"💎":"🔷", draggedPiece.x+dc*draggedPiece.size+draggedPiece.size/2, draggedPiece.y+dr*draggedPiece.size+draggedPiece.size*0.75); }});
      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
